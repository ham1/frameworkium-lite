name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Version to release, e.g. 4.12.0 (blank = strip -SNAPSHOT from current pom version)"
        required: false
      developmentVersion:
        description: "Next development version, e.g. 4.12.1-SNAPSHOT (blank = auto patch bump)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven deps
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute versions
        id: versions
        run: |
          CURRENT=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)

          RELEASE="${{ inputs.releaseVersion }}"
          if [ -z "$RELEASE" ]; then
            RELEASE="${CURRENT%-SNAPSHOT}"
          fi

          DEV="${{ inputs.developmentVersion }}"
          if [ -z "$DEV" ]; then
            IFS='.' read -r major minor patch <<< "$RELEASE"
            DEV="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          fi

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"

      - name: Set release version and tag
        run: |
          mvn -B versions:set -DnewVersion=${{ steps.versions.outputs.release }} -DgenerateBackupPoms=false
          git commit -am "Release ${{ steps.versions.outputs.release }}"
          git tag ${{ steps.versions.outputs.release }}

      - name: Bump to next development version
        run: |
          mvn -B versions:set -DnewVersion=${{ steps.versions.outputs.dev }} -DgenerateBackupPoms=false
          git commit -am "Prepare next development iteration"

      - name: Push commits and tag
        run: git push origin HEAD:main "${{ steps.versions.outputs.release }}"
